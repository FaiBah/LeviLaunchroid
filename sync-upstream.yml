name: Sync LeviLaunchroid to branch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch name to push upstream code into (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone upstream LeviLaunchroid
        run: |
          git clone --recurse-submodules https://github.com/LiteLDev/LeviLaunchroid.git upstream-repo

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push upstream content to target branch
        run: |
          cd upstream-repo
          rm -rf .github/workflows
          git add -A
          git commit -m "Remove upstream workflow files" --allow-empty
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin HEAD:${{ github.event.inputs.target_branch }} --force
