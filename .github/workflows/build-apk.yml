name: Build LeviLaunchroid Release APK

on:
  workflow_dispatch:
    inputs:
      branch_tag:
        description: 'Branch/tag to build from and use as version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_tag }}
          fetch-depth: 0
          fetch-tags: true
          submodules: "recursive"

      - name: Set custom version tag
        run: |
          git tag -f ${{ github.event.inputs.branch_tag }}
          git fetch --tags --force

      - name: Debug git describe
        run: git describe --tags --always

      - name: Placeholder google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease --build-cache

      - name: Rename Unsigned APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n1)
          UNSIGNED_APK="LeviLauncher-${{ github.event.inputs.branch_tag }}-unsigned.apk"
          cp "$APK" "$UNSIGNED_APK"
          echo "UNSIGNED_APK=$UNSIGNED_APK" >> $GITHUB_ENV

      - name: Download Android testkey
        run: |
          wget -q -O testkey.pk8 "https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8"
          wget -q -O testkey.x509.pem "https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem"

      - name: Install apksigner
        run: sudo apt-get update && sudo apt-get install -y apksigner

      - name: Sign APK with testkey
        run: |
          APK_OUT="LeviLauncher-${{ github.event.inputs.branch_tag }}-release.apk"

          apksigner sign \
            --key testkey.pk8 \
            --cert testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$APK_OUT" \
            "${{ env.UNSIGNED_APK }}"

          echo "APK_OUT=$APK_OUT" >> $GITHUB_ENV

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-${{ github.event.inputs.branch_tag }}-signed
          path: ${{ env.APK_OUT }}

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-${{ github.event.inputs.branch_tag }}-unsigned
          path: ${{ env.UNSIGNED_APK }}

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.branch_tag }}
          name: "LeviLauncher ${{ github.event.inputs.branch_tag }}"
          files: |
            ${{ env.APK_OUT }}
            ${{ env.UNSIGNED_APK }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
