name: Modify Java files

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (e.g. v1.5.9)
        required: true
        default: v1.5.9

permissions:
  contents: write

jobs:
  modify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}-source
          fetch-depth: 0

      - name: Replace PlayStoreValidator.java
        run: |
          FILE=app/src/main/java/org/levimc/launcher/util/PlayStoreValidator.java
          test -f "$FILE" || exit 1

          cat > "$FILE" <<'JAVA'
          package org.levimc.launcher.util;

          import android.content.Context;

          public class PlayStoreValidator {
              public static boolean isMinecraftFromPlayStore(Context context) {
                  return true;
              }

              public static boolean isMinecraftInstalled(Context context) {
                  return true;
              }

              public static boolean isLicenseVerified(Context context) {
                  return true;
              }
          }
          JAVA

      - name: Set GitHub API
        run: |
          FILE=app/src/main/java/org/levimc/launcher/util/GithubReleaseUpdater.java
          test -f "$FILE" || exit 1

          sed -i 's|https://api.github.com/repos/%s/%s/releases/latest|https://api.github.com/repos/FaiBah/LeviLaunchroid/releases/latest|' "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update source files"
          git push origin HEAD:${{ inputs.tag }}-source
