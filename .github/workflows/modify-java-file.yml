name: Modify Java file content

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.5.9)'
        required: true
        default: 'v1.5.9'

permissions:
  contents: write

jobs:
  modify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}-source
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Replace PlayStoreValidator.java
        run: |
          FILE="app/src/main/java/org/levimc/launcher/util/PlayStoreValidator.java"

          cat > "$FILE" << 'JAVA'
          package org.levimc.launcher.util;

          import android.content.Context;

          public class PlayStoreValidator {
              public static boolean isMinecraftFromPlayStore(Context context) {
                  return true;
              }

              public static boolean isMinecraftInstalled(Context context) {
                  return true;
              }

              public static boolean isLicenseVerified(Context context) {
                  return true;
              }
          }
          JAVA

      - name: Commit and push change
        run: |
          git add -A
          git commit -m "Update files"
          git push origin HEAD:${{ github.event.inputs.tag }}-source
