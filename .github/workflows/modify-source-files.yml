name: Modify source files

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag
        required: true
  workflow_call:
    inputs:
      tag:
        description: Version tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  modify:
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag
        run: |
          [ -n "${{ inputs.tag }}" ] || {
            echo "ERROR: tag is empty"
            exit 1
          }

          echo "Version: ${{ inputs.tag }}"
          echo "Branch: ${{ inputs.tag }}-source"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}-source
          fetch-depth: 0

      - name: Replace PlayStoreValidator.java
        run: |
          FILE=app/src/main/java/org/levimc/launcher/util/PlayStoreValidator.java
          test -f "$FILE" || exit 1

          cat > "$FILE" <<'JAVA'
          package org.levimc.launcher.util;

          import android.content.Context;

          public class PlayStoreValidator {
              public static boolean isMinecraftFromPlayStore(Context context) {
                  return true;
              }

              public static boolean isMinecraftInstalled(Context context) {
                  return true;
              }

              public static boolean isLicenseVerified(Context context) {
                  return true;
              }
          }
          JAVA

      - name: Set GitHub API
        run: |
          FILE=app/src/main/java/org/levimc/launcher/util/GithubReleaseUpdater.java
          test -f "$FILE" || exit 1

          sed -i \
            's|https://api.github.com/repos/%s/%s/releases/latest|https://api.github.com/repos/FaiBah/LeviLaunchroid/releases/latest|' \
            "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update source files"
          git push origin HEAD:"refs/heads/${{ inputs.tag }}-source"