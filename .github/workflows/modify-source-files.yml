name: Modify source files

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (leave empty for latest source branch)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  modify:
    runs-on: ubuntu-latest

    steps:
      - name: Find source branch
        id: branch
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            echo "branch=${TAG}-source" >> "$GITHUB_OUTPUT"
          else
            BRANCH=$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" \
              | awk -F/ '$NF ~ /^v[0-9]+\.[0-9]+\.[0-9]+-source$/ {print $NF}' \
              | sort -V \
              | tail -n1)

            [ -n "$BRANCH" ] || { echo "No source branch found"; exit 1; }

            echo "Latest source branch: $BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 0

      - name: Replace PlayStoreValidator.java
        run: |
          FILE=app/src/main/java/org/levimc/launcher/util/PlayStoreValidator.java
          test -f "$FILE" || exit 1

          cat > "$FILE" <<'JAVA'
          package org.levimc.launcher.util;

          import android.content.Context;

          public class PlayStoreValidator {
              public static boolean isMinecraftFromPlayStore(Context context) {
                  return true;
              }

              public static boolean isMinecraftInstalled(Context context) {
                  return true;
              }

              public static boolean isLicenseVerified(Context context) {
                  return true;
              }
          }
          JAVA

      - name: Set GitHub API
        run: |
          FILE=app/src/main/java/org/levimc/launcher/util/GithubReleaseUpdater.java
          test -f "$FILE" || exit 1

          sed -i 's|https://api.github.com/repos/%s/%s/releases/latest|https://api.github.com/repos/FaiBah/LeviLaunchroid/releases/latest|' "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update source files"
          git push origin HEAD:${{ steps.branch.outputs.branch }}
