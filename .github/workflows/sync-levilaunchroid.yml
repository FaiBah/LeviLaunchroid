name: Sync LeviLaunchroid to branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get upstream latest version tag
        run: |
          TAG=$(git ls-remote --tags --refs https://github.com/LiteLDev/LeviLaunchroid.git \
            | awk -F/ '{print $3}' \
            | sort -V \
            | tail -n1)

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Latest upstream tag: $TAG"

      - name: Show sync summary
        run: |
          echo "## LeviLaunchroid Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Latest upstream version: **${{ env.TAG }}**" >> $GITHUB_STEP_SUMMARY

      - name: Check if branch already exists
        run: |
          if git ls-remote --heads origin "${{ env.TAG }}" | grep -q "${{ env.TAG }}"; then
            echo "Branch ${{ env.TAG }} already exists. Skipping sync."
            echo "SKIP=true" >> $GITHUB_ENV

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Status: ⏭️ Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Reason: Branch \`${{ env.TAG }}\` already exists." >> $GITHUB_STEP_SUMMARY
          else
            echo "Branch ${{ env.TAG }} does not exist. Continue sync."
            echo "SKIP=false" >> $GITHUB_ENV

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Status: 🔄 Sync required" >> $GITHUB_STEP_SUMMARY
            echo "Creating branch \`${{ env.TAG }}\` from upstream." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Clone upstream LeviLaunchroid
        if: env.SKIP != 'true'
        run: |
          git clone --recurse-submodules --branch ${{ env.TAG }} https://github.com/LiteLDev/LeviLaunchroid.git upstream-repo

      - name: Configure git identity
        if: env.SKIP != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove upstream workflow files
        if: env.SKIP != 'true'
        run: |
          cd upstream-repo
          rm -rf .github/workflows
          git add -A
          git commit -m "Remove upstream workflow files" --allow-empty

      - name: Push upstream content to target branch
        if: env.SKIP != 'true'
        run: |
          cd upstream-repo
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin HEAD:${{ env.TAG }}

      - name: Complete summary
        if: env.SKIP != 'true'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully synced LeviLaunchroid **${{ env.TAG }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch created: \`${{ env.TAG }}\`" >> $GITHUB_STEP_SUMMARY
